apiVersion: v2
name: kargo
description: >-
  Kargo, packaged for the Klastro platform. Wraps the upstream Akuity Kargo
  chart and adds the platform extensions it does not provide: ExternalSecrets
  the Kargo workloads consume, PushSecrets that publish a control plane's shard
  credential to another cluster, the HTTPRoute exposing the Kargo API, and the
  in-cluster identity + RBAC for Kargo controller shards running in other
  clusters. Every extension is optional and driven entirely by values.
type: application

# This is the chart version. This version number should be incremented each time you make changes
# to the chart and its templates, including the app version.
# Versions are expected to follow Semantic Versioning (https://semver.org/)
version: 0.2.1

# This is the version number of the application being deployed. This version number should be
# incremented each time you make changes to the application. Versions are not expected to
# follow Semantic Versioning. They should reflect the version the application is using.
# It is recommended to use it with quotes.
appVersion: "v1.11.0"
sources:
  - https://github.com/akuity/kargo/tree/main/charts/kargo
dependencies:
  - name: kargo
    version: 1.11.0
    repository: "oci://ghcr.io/akuity/kargo-charts"
    alias: kargo
