{{/*
NetworkPolicies for the Twenty release.

The upstream chart's internal Redis runs without authentication and has no
setting to add it, so a policy is the only way to keep the rest of the cluster
off Twenty's job queue and cache.
*/}}
{{- range $name, $policy := .Values.networkPolicies }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}
  namespace: {{ $policy.namespace | default $.Release.Namespace }}
  labels:
    {{- include "twenty-wrapper.labels" $ | nindent 4 }}
    {{- with $policy.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with $policy.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- toYaml $policy.spec | nindent 2 }}
{{- end }}
