{{/*
Gateway API HTTPRoutes for the Twenty release.

The upstream chart only ships an Ingress, and the platform terminates public
traffic on Envoy Gateway instead — so the route lives here. The backend is the
server Service the upstream chart creates (`<fullname>-server`), which serves
both the web app and the GraphQL/REST APIs; the worker has no Service.
*/}}
{{- range $name, $route := .Values.httpRoutes }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $name }}
  namespace: {{ $route.namespace | default $.Release.Namespace }}
  labels:
    {{- include "twenty-wrapper.labels" $ | nindent 4 }}
    {{- with $route.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with $route.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- toYaml $route.parentRefs | nindent 4 }}
  {{- with $route.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- toYaml $route.rules | nindent 4 }}
{{- end }}
