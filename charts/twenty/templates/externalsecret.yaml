{{/*
ExternalSecrets for the Twenty release.

Twenty needs secrets that must not live in git: the PostgreSQL password for its
role, and APP_SECRET / ENCRYPTION_KEY. Neither of the latter may simply be
replaced — a new APP_SECRET invalidates every session, and a new ENCRYPTION_KEY
leaves stored third-party credentials unreadable unless the previous one is set
as FALLBACK_ENCRYPTION_KEY — so they are seeded out-of-band into a secret store
and pulled in here.

This is also why the wrapper turns off the upstream `tokens` Secret: it derives
APP_SECRET from `lookup`, which Argo CD does not support, so under GitOps it
would mint a fresh random value on every render.
*/}}
{{- range .Values.externalSecrets }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .name }}
  namespace: {{ .namespace | default $.Release.Namespace }}
  labels:
    {{- include "twenty-wrapper.labels" $ | nindent 4 }}
    {{- with .labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- toYaml .spec | nindent 2 }}
{{- end }}
