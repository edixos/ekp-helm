# Default values for twenty.
#
# The `twenty:` block is the upstream chart's own values (twentyhq/twenty,
# packages/twenty-docker/helm/twenty), vendored verbatim except for the handful
# of keys the platform fixes (each marked `ekp-helm:`). Everything below the
# block are this wrapper's own additions.
twenty:
  # Default image used by all components
  image:
    repository: twentycrm/twenty
    # ekp-helm: pinned. The vendored chart's own appVersion (v1.14.0) is never
    # bumped upstream, so leaving this empty would deploy a year-old image.
    # Kept equal to this chart's appVersion.
    tag: "v2.26.0"
    pullPolicy: IfNotPresent

  nameOverride: ""
  fullnameOverride: ""

  # ServiceAccount used by the server and worker pods
  serviceAccount:
    create: false  # set true to create a dedicated ServiceAccount instead of using the namespace's "default"
    name: ""  # when create is false, this ServiceAccount must already exist in the namespace; defaults to the chart fullname when create is true
    automount: true  # set false to skip mounting the Kubernetes API token (server and worker do not call the API; IRSA/Workload Identity are unaffected)
    annotations: {}
    # eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/twenty-role
    # iam.gke.io/gcp-service-account: twenty@my-project.iam.gserviceaccount.com

  # Global security context (uid/gid for all pods)
  # ekp-helm: runAsNonRoot, runAsGroup and seccompProfile added. The upstream
  # templates apply this to the server and worker pods only (not Redis) and
  # offer no container-level securityContext.
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault

  # Storage backend: local or s3
  storage:
    type: local
    s3:
      bucket: ""
      region: ""
      endpoint: ""
      # Option A: direct values
      accessKeyId: ""
      secretAccessKey: ""
      # Option B: reference a Secret
      # secretName: my-s3-creds
      # accessKeyIdKey: accessKeyId
      # secretAccessKeyKey: secretAccessKey

  # Auth tokens (random if not provided)
  secrets:
    tokens:
      # ekp-helm: off. Upstream derives APP_SECRET with `lookup`, which Argo CD
      # does not support, so under GitOps every render would mint a new random
      # value. Provide a Secret with an `accessToken` key instead, typically
      # through `externalSecrets` below. Renamed from upstream's generic
      # `tokens` to match the Tilt setup.
      create: false
      name: twenty-secrets
      accessToken: ""

  # Server deployment
  server:
    enabled: true
    replicaCount: 1
    image: {}  # override repository/tag/pullPolicy per component

    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        cpu: 1000m
        memory: 1024Mi

    env:
      SIGN_IN_PREFILLED: "false"
      ACCESS_TOKEN_EXPIRES_IN: "7d"
      LOGIN_TOKEN_EXPIRES_IN: "1h"
    extraEnv: []
    # - name: EMAIL_DRIVER
    #   value: smtp
    # - name: SMTP_PASSWORD
    #   valueFrom:
    #     secretKeyRef:
    #       name: smtp-creds
    #       key: password

    service:
      type: ClusterIP
      port: 3000

    ingress:
      # ekp-helm: off. Public traffic goes through the platform Gateway; see
      # `httpRoutes` below.
      enabled: false
      className: nginx
      acme: true  # add cert-manager annotation for Let's Encrypt
      annotations: {}
      hosts:
        - host: crm.example.com
          paths:
            - path: /
              pathType: Prefix
      tls:
        - secretName: twenty-tls
          hosts:
            - crm.example.com

    persistence:
      enabled: true
      size: 10Gi
      storageClass: ""
      existingClaim: ""
      accessModes:
        - ReadWriteOnce

    dockerDataPersistence:
      enabled: true
      size: 100Mi
      storageClass: ""
      existingClaim: ""
      accessModes:
        - ReadWriteOnce

    extraVolumeMounts: []

    # Pod scheduling and DNS
    nodeSelector: {}
    tolerations: []
    affinity: {}
    dnsPolicy: ~
    dnsConfig: {}

    # Health probes for the server container. Set any probe to null to disable it.
    # startupProbe gates the slow initial boot (up to periodSeconds x failureThreshold),
    # so liveness/readiness intentionally carry no initialDelaySeconds.
    startupProbe:
      httpGet:
        path: /healthz
        port: http-tcp
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 30
    livenessProbe:
      httpGet:
        path: /healthz
        port: http-tcp
      periodSeconds: 30
      timeoutSeconds: 5
      failureThreshold: 3
    readinessProbe:
      httpGet:
        path: /healthz
        port: http-tcp
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3

  # Worker deployment
  worker:
    enabled: true
    replicaCount: 1
    image: {}
    command: ["yarn", "worker:prod"]

    resources:
      requests:
        cpu: 250m
        memory: 1024Mi
      limits:
        cpu: 1000m
        memory: 2048Mi

    extraEnv: []

    # Pod scheduling and DNS
    nodeSelector: {}
    tolerations: []
    affinity: {}
    dnsPolicy: ~
    dnsConfig: {}

  # PostgreSQL
  db:
    # ekp-helm: left at the upstream default, but note that the internal
    # database's generated passwords use the same `lookup` as the tokens
    # Secret, so under Argo CD set this to false and use `external`.
    enabled: true
    internal:
      database: twenty
      appUser: twenty_app_user
      appPassword: ""  # random if empty
      image:
        repository: twentycrm/twenty-postgres-spilo
        tag: 3.3-p2
      resources:
        requests:
          cpu: 250m
          memory: 256Mi
        limits:
          cpu: 1000m
          memory: 1024Mi
      persistence:
        enabled: true
        size: 10Gi
        storageClass: ""
        existingClaim: ""
        accessModes:
          - ReadWriteOnce
      env:
        PGUSER_SUPERUSER: postgres
        PGPASSWORD_SUPERUSER: postgres
        SPILO_PROVIDER: local
        ALLOW_NOSSL: "true"

    external:
      host: ""
      port: 5432
      user: twenty_app_user
      password: ""
      database: twenty
      ssl: false
      secretName: ""
      passwordKey: ""

  # Redis
  redisInternal:
    enabled: true
    image:
      repository: redis/redis-stack-server
      tag: 7.2.0-v10
      pullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 250m
        memory: 1024Mi
      limits:
        cpu: 500m
        memory: 2048Mi
    service:
      port: 6379
    persistence:
      enabled: false
      size: 1Gi
      storageClass: ""
      existingClaim: ""
      accessModes:
        - ReadWriteOnce

  # External Redis (when redisInternal.enabled=false)
  redis:
    external:
      host: ""
      port: 6379
      password: ""
      secretName: ""
      passwordKey: ""

# -- List of ExternalSecrets to deploy
externalSecrets: []

# -- Map of Gateway API HTTPRoutes to deploy, keyed by route name
httpRoutes: {}

# -- Map of Envoy Gateway SecurityPolicies to deploy, keyed by policy name (e.g. an IP allowlist attached to an HTTPRoute)
securityPolicies: {}

# -- Map of NetworkPolicies to deploy, keyed by policy name
networkPolicies: {}
