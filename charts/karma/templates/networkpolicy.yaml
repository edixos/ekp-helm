{{- range $name, $policy := .Values.networkPolicies }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "karma.labels" $ | nindent 4 }}
spec:
  {{- toYaml (required (printf "networkPolicies.%s.spec is required" $name) $policy.spec) | nindent 2 }}
{{- end }}
