---
# Default values for zammad.
#
# The `zammad:` block is the upstream zammad-helm chart's own values, vendored
# verbatim except for the handful of keys the platform fixes (each marked
# `ekp-helm:`). Everything below the block are this wrapper's own additions.
zammad:
  image:
    repository: ghcr.io/zammad/zammad
    # If not set, appVersion field from Chart.yaml is used as default.
    # appVersion points to a fixed version. You are responsible to update this to newer patch level versions yourself.
    # Alternatively, you can also use floating versions that will give you automatic updates:
    # tag: "6.2"     # all patchlevel updates
    # tag: "6"       # including minor updates
    # tag: "latest"  # all updates of stable versions, including major
    # tag: "develop" # bleeding-edge development version
    # If you want to use a floating version, you should also set pullPolicy: Always
    tag: ""
    pullPolicy: IfNotPresent
    imagePullSecrets: []
      # - name: "image-pull-secret"

  service:
    type: ClusterIP
    port: 8080
    appProtocol: kubernetes.io/ws

  ingress:
    enabled: false
    className: ""
    annotations: {}
      # kubernetes.io/ingress.class: nginx
      # kubernetes.io/tls-acme: "true"
    hosts:
      - host: chart-example.local
        paths:
          - path: /
            pathType: ImplementationSpecific
    tls: []
      # - secretName: chart-example-tls
      #   hosts:
      #     - chart-example.local
    labels: {}


  # Please note that passwords for PostgreSQL, Redis and S3 may not
  #   contain special characters which would require URL encoding.
  # See also https://github.com/zammad/zammad-helm/issues/251
  secrets:
    autowizard:
      useExisting: false
      secretKey: autowizard
      secretName: autowizard
    elasticsearch:
      useExisting: false
      secretKey: password
      secretName: elastic-credentials
    postgresql:
      # ekp-helm: the database password is never rendered into a Secret by this
      # chart. It is synced from Secret Manager by the `externalSecrets` entry
      # below, which is also what the CNPG managed role reads — one remote
      # value, two namespaces, so the role and the client cannot drift apart.
      useExisting: true
      secretKey: password
      secretName: zammad-db
    redis:
      useExisting: false
      secretKey: redis-password
      secretName: redis-pass
      sentinel:
        useExisting: false
        secretKey: redis-sentinel-password
        secretName: redis-sentinel-pass
    s3:
      useExisting: false
      secretKey: s3-url
      secretName: s3-url

  securityContext:
    fsGroup: 1000
    # https://kubernetes.io/docs/tasks/configure-pod-container/security-context/#configure-volume-permission-and-ownership-change-policy-for-pods
    fsGroupChangePolicy: Always
    runAsUser: 1000
    runAsNonRoot: true
    runAsGroup: 1000
    seccompProfile:
      type: RuntimeDefault

  podDisruptionBudget:
    enabled: false
    # Specify either minAvailable or maxUnavailable, not both.
    # Note: scheduler and websocket are not horizontally scalable (always 1 replica).
    # Use maxUnavailable: 1 to avoid blocking node drains on those components.
    minAvailable: ""
    maxUnavailable: ""

  zammadConfig:
    elasticsearch:
      # ekp-helm: off in every profile. Elasticsearch only powers Zammad's
      # full-text search over tickets; it costs more memory than the rest of the
      # stack combined and the helpdesk works without it. `initialisation` has to
      # go off with it — left on, the init job blocks waiting for a cluster that
      # was never deployed.
      # enable/disable elasticsearch chart dependency
      enabled: false
      # host env var is only used when zammadConfig.elasticsearch.enabled is false
      host: zammad-elasticsearch-master
      initialisation: false
      pass: ""
      port: 9200
      reindex: false
      schema: http
      user: ""

    memcached:
      # enable/disable memcached chart dependency
      enabled: true
      # host env var is only used when zammadConfig.memcached.enabled is false
      host: zammad-memcached
      port: 11211

    rustfs:
      # enable/disable rustfs chart dependency (S3 storage provider for attachments)
      enabled: false

      # Create the bucket in the bundled rustfs instance if it does not exist yet.
      # Unlike the former minio subchart, the rustfs chart has no built-in bucket
      # provisioning, so the zammad-init job takes care of it. Only applies to the
      # bundled instance; an external S3 service is never modified.
      bucketInitialisation: true

      # Bucket used for attachment storage in the bundled rustfs instance.
      bucket: zammad

      # Uncomment this in case you want to use an external S3 service.
      # externalS3Url: https://user:pw@external-s3-service/bucket

    nginx:
      replicas: 1
      trustedProxies: []
      extraHeaders: []
        # - 'HeaderName "Header Value"'
      websocketExtraHeaders: []
        # - 'HeaderName "Header Value"'
      # Maximum upload size
      clientMaxBodySize: 50M
      knowledgeBaseUrl: ""
      listenIpv4: true
      listenIpv6: true
      startupProbe:
        tcpSocket:
          port: 8080
        failureThreshold: 20
        periodSeconds: 4
      livenessProbe:
        tcpSocket:
          port: 8080
        failureThreshold: 5
        timeoutSeconds: 5
      readinessProbe:
        httpGet:
          path: /
          port: 8080
        failureThreshold: 5
        timeoutSeconds: 5
      resources: {}
        # requests:
        #   cpu: 50m
        #   memory: 32Mi
        # limits:
        #   cpu: 100m
        #   memory: 64Mi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        readOnlyRootFilesystem: true
        privileged: false
      # can be used to add additional containers / sidecars
      sidecars: []
      # additional environment vars (values should be unique between deployment and global extraEnv)
      extraEnv: []
      podLabels: {}
        # my-label: "value"
      podAnnotations: {}
        # my-annotation: "value"
      nodeSelector: {}
        # node-label: "value"
      tolerations: []
        # - key: "key"
        #   operator: "Equal"
        #   value: "value"
        #   effect: "NoSchedule"
      affinity: {}
        # nodeAffinity:
        #   requiredDuringSchedulingIgnoredDuringExecution:
        #     nodeSelectorTerms:
        #       - matchExpressions:
        #           - key: "node-label"
        #             operator: In
        #             values:
        #               - "value"
        # podAntiAffinity:
        #   preferredDuringSchedulingIgnoredDuringExecution:
        #     - weight: 100
        #       podAffinityTerm:
        #         topologyKey: kubernetes.io/hostname # For host anti-affinity
        #         labelSelector:
        #           matchLabels:
        #             app.kubernetes.io/component: zammad-nginx
      topologySpreadConstraints: []
        # - maxSkew: 1
        #   topologyKey: "kubernetes.io/hostname"
        #   whenUnsatisfiable: ScheduleAnyway
        #   labelSelector:
        #     matchLabels:
        #      app.kubernetes.io/name: zammad

    postgresql:
      # ekp-helm: never the bundled subchart. Zammad shares the platform's
      # CloudNativePG cluster, so `host` is the CNPG `-rw` Service and the
      # database, role and password are owned by the cnpg release — see the
      # `databases` / `externalSecrets` entries in gitops infra values. Set
      # `host` per environment; there is no sane default for it.
      # enable/disable postgresql chart dependency
      enabled: false
      # needs to be the same as the postgres.auth.database
      db: zammad
      # Host of an external PostgreSQL server, only used when enabled is false.
      #   When the subchart is enabled, the host is derived from the release name instead.
      host: ""
      # ekp-helm: unused — secrets.postgresql.useExisting is true, so the password
      # comes from the `zammad-db` Secret and this value is never rendered.
      pass: ""
      port: 5432
      # needs to be the same as the postgres.auth.username
      user: zammad
      # additional connection options
      options: "pool=50"

    railsserver:
      replicas: 1
      startupProbe:
        tcpSocket:
          port: 3000
        failureThreshold: 20
        periodSeconds: 4
      livenessProbe:
        tcpSocket:
          port: 3000
        failureThreshold: 5
        timeoutSeconds: 5
      readinessProbe:
        httpGet:
          path: /
          port: 3000
        failureThreshold: 5
        timeoutSeconds: 5
      resources: {}
        # requests:
        #   cpu: 100m
        #   memory: 512Mi
        # limits:
        #   cpu: 200m
        #   memory: 1024Mi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        readOnlyRootFilesystem: true
        privileged: false
      # can be used to add additional containers / sidecars
      sidecars: []
      trustedProxies: "['127.0.0.1', '::1']"
      listenAddress: "[::]"
      webConcurrency: 0
      # additional environment vars (values should be unique between deployment and global extraEnv)
      extraEnv: []
      # tmpdir will be used by all Zammad/Rails containers
      tmpdir: "/opt/zammad/tmp"
      podLabels: {}
        # my-label: "value"
      podAnnotations: {}
        # my-annotation: "value"
      affinity: {}
        # nodeAffinity:
        #   requiredDuringSchedulingIgnoredDuringExecution:
        #     nodeSelectorTerms:
        #       - matchExpressions:
        #           - key: "node-label"
        #             operator: In
        #             values:
        #               - "value"
        # podAntiAffinity:
        #   preferredDuringSchedulingIgnoredDuringExecution:
        #     - weight: 100
        #       podAffinityTerm:
        #         topologyKey: kubernetes.io/hostname # For host anti-affinity
        #         labelSelector:
        #           matchLabels:
        #             app.kubernetes.io/component: zammad-railsserver
      nodeSelector: {}
        # node-label: "value"
      tolerations: []
        # - key: "key"
        #   operator: "Equal"
        #   value: "value"
        #   effect: "NoSchedule"
      topologySpreadConstraints: []
        # - maxSkew: 1
        #   topologyKey: "kubernetes.io/hostname"
        #   whenUnsatisfiable: ScheduleAnyway
        #   labelSelector:
        #     matchLabels:
        #      app.kubernetes.io/name: zammad

    redis:
      # enable/disable redis chart dependency
      enabled: true
      host: zammad-redis-master
      port: 6379
      # leave empty if no username is required
      username:
      # needs to be the same as the redis.auth.password
      pass: zammad
      # set to true to use rediss:// schema (TLS)
      tls: false

      sentinel:
        enabled: false  # set to true to enable Redis Sentinel; with the bundled subchart
                        # (zammadConfig.redis.enabled=true) this also requires
                        # redis.sentinel.enabled=true and redis.architecture=replication
        # only used when zammadConfig.redis.enabled=false (external Redis/Sentinel); the
        # bundled subchart's sentinel service is discovered automatically and ignores this list
        sentinels:
        - zammad-redis:26379
        masterName: mymaster
        # leave empty if no username is required
        username:
        pass: zammad

    scheduler:
      # This component may only run once per cluster, so only 0 (disabled) and 1 are supported.
      #   Higher values are capped to 1.
      replicas: 1
      resources: {}
        # requests:
        #   cpu: 100m
        #   memory: 256Mi
        # limits:
        #   cpu: 200m
        #   memory: 512Mi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        readOnlyRootFilesystem: true
        privileged: false
      # can be used to add additional containers / sidecars
      sidecars: []
      # additional environment vars (values should be unique between deployment and global extraEnv)
      extraEnv: []
      podLabels: {}
        # my-label: "value"
      podAnnotations: {}
        # my-annotation: "value"
      affinity: {}
        # nodeAffinity:
        #   requiredDuringSchedulingIgnoredDuringExecution:
        #     nodeSelectorTerms:
        #       - matchExpressions:
        #           - key: "node-label"
        #             operator: In
        #             values:
        #               - "value"
      nodeSelector: {}
        # node-label: "value"
      tolerations: []
        # - key: "key"
        #   operator: "Equal"
        #   value: "value"
        #   effect: "NoSchedule"
      topologySpreadConstraints: []
        # - maxSkew: 1
        #   topologyKey: "kubernetes.io/hostname"
        #   whenUnsatisfiable: ScheduleAnyway
        #   labelSelector:
        #     matchLabels:
        #      app.kubernetes.io/name: zammad

    storageVolume:
      # Enable this for 'File' based storage in Zammad. You must provide an externally managed 'extistingClaim'
      #   with 'ReadWriteMany' permisssion in this case.
      enabled: false
      ##
      ## A manually managed Persistent Volume and Claim
      ## If defined, PVC must be created manually before volume will be bound
      ## The value is evaluated as a template, so, for example, the name can depend on .Release or .Chart
      ##
      # existingClaim:

    tmpDirVolume:
      emptyDir:
        sizeLimit: 100Mi
        # enable "medium: Memory" to Work around problems with world writable tmp dir permissions if volumePermissions.enabled is set to false
        # see: https://github.com/kubernetes/kubernetes/issues/76158 & https://github.com/kubernetes/kubernetes/issues/110835
        # medium: Memory

    # Custom volumes for all Zammad Pods.
    customVolumes:
      # - name: custom-volume
      #   configMap:
      #     name: my-config-map

    # Custom volumeMounts for all Zammad Pods.
    customVolumeMounts:
      # - name: custom-volume
      #   mountPath: "/opt/zammad/config_map"
      #   readOnly: true

    websocket:
      # This component may only run once per cluster, so only 0 (disabled) and 1 are supported.
      #   Higher values are capped to 1.
      replicas: 1
      startupProbe:
        tcpSocket:
          port: 6042
        failureThreshold: 20
        periodSeconds: 4
      livenessProbe:
        tcpSocket:
          port: 6042
        failureThreshold: 10
        timeoutSeconds: 5
      readinessProbe:
        tcpSocket:
          port: 6042
        failureThreshold: 5
        timeoutSeconds: 5
      resources: {}
        # requests:
        #   cpu: 100m
        #   memory: 256Mi
        # limits:
        #   cpu: 200m
        #   memory: 512Mi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        readOnlyRootFilesystem: true
        privileged: false
      listenAddress: "::"
      # can be used to add additional containers / sidecars
      sidecars: []
      # additional environment vars (values should be unique between deployment and global extraEnv)
      extraEnv: []
      podLabels: {}
        # my-label: "value"
      podAnnotations: {}
        # my-annotation: "value"
      affinity: {}
        # nodeAffinity:
        #   requiredDuringSchedulingIgnoredDuringExecution:
        #     nodeSelectorTerms:
        #       - matchExpressions:
        #           - key: "node-label"
        #             operator: In
        #             values:
        #               - "value"
      nodeSelector: {}
        # node-label: "value"
      tolerations: []
        # - key: "key"
        #   operator: "Equal"
        #   value: "value"
        #   effect: "NoSchedule"
      topologySpreadConstraints: []
        # - maxSkew: 1
        #   topologyKey: "kubernetes.io/hostname"
        #   whenUnsatisfiable: ScheduleAnyway
        #   labelSelector:
        #     matchLabels:
        #      app.kubernetes.io/name: zammad

    initContainers:
      elasticsearch:
        resources: {}
          # requests:
          #   cpu: 100m
          #   memory: 256Mi
          # limits:
          #   cpu: 200m
          #   memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          readOnlyRootFilesystem: true
          privileged: false
      postgresql:
        resources: {}
          # requests:
          #   cpu: 100m
          #   memory: 256Mi
          # limits:
          #   cpu: 200m
          #   memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          readOnlyRootFilesystem: true
          privileged: false
      # Provisions the bucket in the bundled rustfs instance, see
      #   zammadConfig.rustfs.bucketInitialisation.
      s3:
        resources: {}
          # requests:
          #   cpu: 100m
          #   memory: 256Mi
          # limits:
          #   cpu: 200m
          #   memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          readOnlyRootFilesystem: true
          privileged: false
      # VolumePermissions will be used by all Zammad Pods.
      # We need it to drop global write permission that comes with EmptyDir, otherwise
      #   Ruby's Tempfile.create raises an error.
      volumePermissions:
        enabled: true
        image:
          repository: alpine
          tag: "3.24.2"
          pullPolicy: IfNotPresent
        command:
          - /bin/sh
          - -cx
          - |
            chmod 770 /opt/zammad/tmp
        resources: {}
          # requests:
          #   cpu: 100m
          #   memory: 256Mi
          # limits:
          #   cpu: 200m
          #   memory: 512Mi
        securityContext:
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
          privileged: true
          runAsNonRoot: false
          runAsUser: 0
      zammad:
        resources: {}
          # requests:
          #   cpu: 100m
          #   memory: 256Mi
          # limits:
          #   cpu: 200m
          #   memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          readOnlyRootFilesystem: true
          privileged: false
        customInit: ""
          #  bundle exec rails runner '…'

    initJob:
      # Runs the database/Elasticsearch initialisation on every install and upgrade.
      # Only disable this temporarily for maintenance tasks that must not have the database
      #   initialised, e.g. while restoring a dump (see the PostgreSQL migration notes in the README).
      #   Zammad will not work correctly if this is left disabled permanently.
      enabled: true
      # Appends the release revision to the job name so a new job always runs on
      #   install/upgrade. Note that `helm template` and GitOps tools that render
      #   manifests statically (e.g. Argo CD) always see revision 1, so the name
      #   stays constant there and the job will not re-run on subsequent syncs -
      #   see the Argo CD section in the README.
      # ekp-helm: false, because under Argo CD the revision is always 1 and the
      # suffix therefore only produces a permanently-named `-1` job that never
      # re-runs. The migrations are re-run instead by the Argo sync-hook
      # annotations below, which delete the previous Job before each sync.
      randomName: false
      # specify how long after finish pods are deleted
      ttlSecondsAfterFinished: 300
      # ekp-helm: PreSync rather than the default plain resource. Zammad's Rails
      # containers start with RAILS_CHECK_PENDING_MIGRATIONS=true and refuse to
      # boot while a migration is outstanding, so the schema has to be current
      # *before* the new Deployments roll — which is exactly what PreSync means.
      # BeforeHookCreation deletes the completed Job from the previous sync;
      # without it the second sync finds an immutable, already-Complete Job and
      # the migrations silently never run.
      annotations:
        argocd.argoproj.io/hook: PreSync
        argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
      # my-annotation: "value"
      podLabels: {}
        # my-label: "value"
      podAnnotations: {}
      # my-annotation: "value"
      podSpec: {}
      # my-podspec: "value"
      affinity: {}
        # nodeAffinity:
        #   requiredDuringSchedulingIgnoredDuringExecution:
        #     nodeSelectorTerms:
        #       - matchExpressions:
        #           - key: "node-label"
        #             operator: In
        #             values:
        #               - "value"
      nodeSelector: {}
        # node-label: "value"
      tolerations: []
        # - key: "key"
        #   operator: "Equal"
        #   value: "value"
        #   effect: "NoSchedule"

      topologySpreadConstraints: []
        # - maxSkew: 1
        #   topologyKey: "kubernetes.io/hostname"
        #   whenUnsatisfiable: ScheduleAnyway
        #   labelSelector:
        #     matchLabels:
        #      app.kubernetes.io/name: zammad

    cronJob:
      reindex:
        # By default, this cronjob never runs. It can be used to create maintenance jobs with
        #   kubectl create job my-reindex-job --from=cronjob/zammad-cronjob-reindex
        # You can change schedule and suspend to run it periodically.
        schedule: "@weekly"
        suspend: true
        annotations: {}
        # my-annotation: "value"
        podLabels: {}
          # my-label: "value"
        podAnnotations: {}
        # my-annotation: "value"
        podSpec: {}
        # my-podspec: "value"

  # additional environment vars added to all zammad services (values should be unique between deployment and global extraEnv)
  extraEnv: []
    # - name: FOO_BAR
    #   value: "foobar"

  # autowizard config
  # if a token is used the url must look like: http://zammad/#getting_started/auto_wizard/your_token_here
  autoWizard:
    enabled: false
    # string with the autowizard config as json
    # config: |
    #   {
    #     "Token": "secret_zammad_autowizard_token",
    #     "TextModuleLocale": {
    #       "Locale": "en-us"
    #     },
    #     "Users": [
    #       {
    #         "login": "email@example.org",
    #         "firstname": "Zammad",
    #         "lastname": "Admin",
    #         "email": "email@example.org",
    #         "organization": "ZammadTest",
    #         "password": "..."
    #       }
    #     ],
    #     "Settings": [
    #       {
    #         "name": "product_name",
    #         "value": "ZammadTestSystem"
    #       },
    #       {
    #         "name": "system_online_service",
    #         "value": true
    #       }
    #     ],
    #     "Organizations": [
    #       {
    #         "name": "ZammadTest"
    #       }
    #     ]
    #   }

  # Common pod affinity for all Zammad components. Values in .Zammad.*.affinity will override this.
  affinity: {}
    # nodeAffinity:
    #   requiredDuringSchedulingIgnoredDuringExecution:
    #     nodeSelectorTerms:
    #       - matchExpressions:
    #           - key: "node-label"
    #             operator: In
    #             values:
    #               - "value"

  commonAnnotations: {}
    # my-annotation: "value"

  commonLabels: {}
    # my-label: "value"

  # Common pod nodeSelector for all Zammad components. Values in .Zammad.*.nodeSelector will override this.
  nodeSelector: {}
    # node-label: "value"

  podAnnotations: {}
    # my-annotation: "value"

  podLabels: {}
    # my-label: "value"

  # Common pod tolerations for all Zammad components. Values in .Zammad.*.tolerations will override this.
  tolerations: []
    # - key: "key"
    #   operator: "Equal"
    #   value: "value"
    #   effect: "NoSchedule"

  topologySpreadConstraints: []
    # - maxSkew: 1
    #   topologyKey: "kubernetes.io/hostname"
    #   whenUnsatisfiable: ScheduleAnyway
    #   labelSelector:
    #     matchLabels:
    #      app.kubernetes.io/name: zammad

  # service account configurations
  serviceAccount:
    # Specifies whether a service account should be created
    create: false
    # Annotations to add to the service account
    annotations: {}
    # The name of the service account to use.
    # If not set and create is true, a name is generated using the fullname template
    name: ""

  # can be used to add additional init containers
  initContainers: []
    # - name: s3-restore
    #   image: some-aws-s3-restore:latest
    #   env:
    #     - name: AWS_DEFAULT_REGION
    #       value: "eu-central-1"
    #     - name: AWS_ACCESS_KEY_ID
    #       value: "xxxxxxxxxxxx"
    #     - name: AWS_SECRET_ACCESS_KEY
    #       value: "xxxxxxxxxxxx"
    #     - name: SYNC_DIR
    #       value: "/opt/zammad"
    #     - name: AWS_SYNC_BUCKET
    #       value: "some-backup-bucket"
    #   volumeMounts:
    #     - name: help-zammad
    #       mountPath: /opt/zammad


  # dependency charts config

  # Settings for the elasticsearch subchart
  elasticsearch:
    # Workaround: switch to bitnami legacy image repository (https://github.com/bitnami/containers/issues/83267)
    image:
      repository: bitnamilegacy/elasticsearch
    sysctlImage:
      repository: bitnamilegacy/os-shell
    volumePermissions:
      image:
        repository: bitnamilegacy/os-shell
    metrics:
      image:
        repository: bitnamilegacy/elasticsearch-exporter
    global:
      security:
        allowInsecureImages: true

    clusterName: zammad
    coordinating:
      replicaCount: 0
    data:
      replicaCount: 0
    ingest:
      replicaCount: 0
    master:
      heapSize: 512m
      masterOnly: false
      replicaCount: 1
      resourcesPreset: medium
      resources: {}
        # requests:
        #   cpu: 50m
        #   memory: 512Mi
        # limits:
        #   cpu: 100m
        #   memory: 1024Mi

    # To use an existing Kubernetes secret containing the credentials,
    # remove the comments on the lines below and adjust them accordingly
    #
    # security:
    #   existingSecret: elastic-credentials

  # settings for the memcached subchart
  memcached:
    replicaCount: 1
    resources: {}
      # requests:
      #   cpu: 50m
      #   memory: 64Mi
      # limits:
      #   cpu: 100m
      #   memory: 128Mi

  # settings for the rustfs subchart
  rustfs:
    # Run a single node with a single data volume. The subchart itself defaults to a
    # distributed, erasure-coded cluster of four pods, which is far more than Zammad's
    # attachment store needs and would also be a big jump from the previous minio
    # default. Scale this out via mode.distributed if you need the redundancy.
    mode:
      standalone:
        enabled: true
      distributed:
        enabled: false
    replicaCount: 1

    secret:
      rustfs:
        access_key: zammadadmin
        secret_key: zammadadmin

      # Use an existing secret for the credentials (secret.rustfs.access_key and
      # secret.rustfs.secret_key will be ignored and picked up from this secret).
      # The secret has to contain the keys RUSTFS_ACCESS_KEY and RUSTFS_SECRET_KEY.
      # existingSecret: rustfs-credentials

    config:
      rustfs:
        # The chart builds the region into the S3 URL from this value, so the server
        # and what Zammad signs its requests with stay in sync if you change it.
        # (rustfs does not currently reject a mismatch, but do not rely on that.)
        region: zammad
        # Web UI, you can enable this for debugging.
        console_enable: "false"
        # Log to stdout rather than into a second PersistentVolumeClaim.
        obs_log_directory: ""
        obs_environment: production

    # Zammad talks to rustfs cluster-internally, so no ingress is needed. The subchart
    # would otherwise create one for its example.rustfs.com default host.
    ingress:
      enabled: false

    storageclass:
      # Empty means the cluster's default StorageClass is used.
      name: ""
      dataStorageSize: 10Gi

  # settings for the postgres subchart
  postgres:
    auth:
      # Creates this user as a superuser and a database with the name from auth.database.
      # These must match zammadConfig.postgresql.user/pass/db.
      username: "zammad"
      password: "zammad"
      database: "zammad_production"

      # To avoid passwords in your values.yaml, you can comment out the password above
      # and use an existing Kubernetes secret. Remove the comments on the lines below
      # and adjust them accordingly.
      # The subchart reads the password from the key named in secretKeys.adminPasswordKey,
      # which defaults to 'postgres-password'. The example below overrides it to match the
      # secret that Zammad itself uses (see secrets.postgresql above), so that a single
      # secret can serve both. Set secrets.postgresql.useExisting to true in that case.
      #
      # existingSecret: postgresql-pass
      # secretKeys:
      #   adminPasswordKey: postgresql-pass

    # The user from auth.username above is created via the official image's POSTGRES_USER, which is
    #   always a superuser. Zammad does not need those privileges (it only requires the plpgsql
    #   extension, which is present by default). To run Zammad unprivileged instead, point auth.* at
    #   separate superuser credentials and create Zammad's user through the subchart's customUser:
    #
    # auth:
    #   username: postgres
    #   database: postgres
    #   password: "a-superuser-password"
    # customUser:
    #   name: zammad             # must match zammadConfig.postgresql.user
    #   database: zammad_production  # must match zammadConfig.postgresql.db
    #   password: zammad         # must match zammadConfig.postgresql.pass
    #
    # Note that customUser only takes effect on the initial creation of the database. Restore dumps as
    #   the Zammad user rather than the superuser, so that it owns the restored tables.

    resources: {}
      # requests:
      #   cpu: 250m
      #   memory: 256Mi
      # limits:
      #   cpu: 500m
      #   memory: 512Mi

  # settings for the redis subchart
  redis:
    sentinel:
      # set to true to enable Redis Sentinel
      enabled: false
    architecture: standalone
    auth:
      password: zammad
      # To avoid passwords in your values.yaml, you can comment out the line above
      # and use an existing Kubernetes secret. Remove the comments on the lines below
      # and adjust them accordingly
      #
      # existingSecret: redis-pass
      # existingSecretPasswordKey: redis-password
    resources: {}
    # limits:
    #   cpu: 250m
    #   memory: 256Mi
    # requests:
    #   cpu: 250m
    #   memory: 256Mi

# -- List of ExternalSecrets to deploy
externalSecrets: []

# -- Map of Gateway API HTTPRoutes to deploy, keyed by route name
httpRoutes: {}

# -- Map of Envoy Gateway SecurityPolicies to deploy, keyed by policy name (e.g. an IP allowlist attached to an HTTPRoute)
securityPolicies: {}

# -- List of VictoriaMetrics VMServiceScrapes to deploy
vmServiceScrapes: []
