{{/*
ExternalSecrets for the Zammad release.

Zammad needs three secrets that must not live in git: the PostgreSQL password
for its CNPG role, the Rails SECRET_KEY_BASE, and the API token klastro-ui
authenticates its server-to-server ticket writes with. All three are seeded
out-of-band into Secret Manager and pulled in here.

The database password is deliberately NOT generated by an External Secrets
`Password` generator: CloudNativePG needs the same value in the Cluster's own
namespace to create the role, a generator mints a fresh value per ExternalSecret,
and the two would never match. A single remote key read from both namespaces is
what keeps the role and the client in agreement.
*/}}
{{- range .Values.externalSecrets }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .name }}
  namespace: {{ .namespace | default $.Release.Namespace }}
  labels:
    {{- include "zammad-wrapper.labels" $ | nindent 4 }}
    {{- with .labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- toYaml .spec | nindent 2 }}
{{- end }}
