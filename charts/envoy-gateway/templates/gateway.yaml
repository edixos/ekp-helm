{{- range $name, $config := .Values.gateways -}}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ $name }}
  namespace: {{ $config.namespace }}
  labels:
    {{- include "envoy-gateway.labels" $ | nindent 4 }}
spec:
  gatewayClassName: {{ $config.gatewayClassName }}
  {{- with $config.addresses }}
  addresses:
{{ toYaml . | indent 4 }}
  {{- end }}
  {{- with $config.infrastructure }}
  infrastructure:
{{ toYaml . | indent 4 }}
  {{- end }}
  listeners:
{{ toYaml $config.listeners | indent 4 }}
---
{{ end -}}
