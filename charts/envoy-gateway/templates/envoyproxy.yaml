{{- if .Values.envoyProxy.enabled -}}
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: {{ .Values.envoyProxy.name }}
  namespace: {{ .Values.envoyProxy.namespace }}
  labels:
    {{- include "envoy-gateway.labels" . | nindent 4 }}
spec:
{{- if .Values.envoyProxy.provider }}
  provider:
    {{- toYaml .Values.envoyProxy.provider | nindent 4 }}
{{- else }}
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        type: {{ .Values.envoyProxy.type }}
        externalTrafficPolicy: {{ .Values.envoyProxy.externalTrafficPolicy }}
{{- end }}
{{- end }}

{{- range $name, $config := .Values.envoyProxies }}
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: {{ $name }}
  namespace: {{ $config.namespace | default $.Release.Namespace }}
  labels:
    {{- include "envoy-gateway.labels" $ | nindent 4 }}
spec:
  {{- toYaml (required (printf "envoyProxies.%s.spec is required" $name) $config.spec) | nindent 2 }}
{{- end }}
