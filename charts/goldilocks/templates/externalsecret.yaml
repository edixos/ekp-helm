{{/*
ExternalSecrets for the Goldilocks release.

Goldilocks itself holds no credentials: it authenticates to the API server with
its ServiceAccount token and its dashboard has no login. This template is the
platform escape hatch for the Secrets a release still *references* without the
chart creating them — an image pull secret named in
`goldilocks.imagePullSecrets` when the images come from a private mirror, or the
TLS secret named in `goldilocks.dashboard.ingress.tls` when the dashboard is
exposed through an Ingress rather than the Gateway.

Each entry takes `name`, an optional `namespace`, `labels`, `annotations`, and
the ExternalSecret `spec` verbatim. Empty by default, so nothing renders unless
a release asks for it.
*/}}
{{- range .Values.externalSecrets }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .name }}
  namespace: {{ .namespace | default $.Release.Namespace }}
  labels:
    {{- include "goldilocks-wrapper.labels" $ | nindent 4 }}
    {{- with .labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- toYaml .spec | nindent 2 }}
{{- end }}
