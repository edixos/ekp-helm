{{- if and (or .Values.prometheus.enabled .Values.victoriaMetrics.enabled) .Values.prometheus.grafanaDashboard.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "tetragon.fullname" . }}-grafana-dashboards
  namespace: {{ .Release.Namespace | quote }}
  labels:
    app: tetragon-grafana
    {{- include "tetragon.labels" . | nindent 4 }}
{{- .Values.prometheus.grafanaDashboard.label | toYaml | nindent 4 }}
data:
  {{- (.Files.Glob "resources/grafana-dashboards/*.json").AsConfig | nindent 2 }}
{{- end }}
