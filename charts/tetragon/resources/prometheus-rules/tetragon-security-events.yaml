groups:
- name: tetragon.security.rules
  rules:
  # Near-zero-false-positive signals: these policies match operations that a
  # legitimate workload never performs, so a single event is actionable.
  - alert: TetragonHostEscapeAttempt
    expr: sum by (policy) (increase(tetragon_policy_events_total{policy="host-escape-attempts"}[5m])) > 0
    for: 0m
    labels:
      severity: critical
    annotations:
      summary: "Container attempted a host escape primitive"
      description: "The host-escape-attempts policy matched {{ printf \"%.0f\" $value }} event(s) in the last 5m: a container wrote a host-kernel control file (core_pattern/modprobe/sysrq/release_agent) or read /proc/kcore. Identify the pod from the Tetragon event stream and treat the session as compromised."

  - alert: TetragonKernelModuleLoad
    expr: sum by (policy) (increase(tetragon_policy_events_total{policy="kernel-module-load"}[5m])) > 0
    for: 0m
    labels:
      severity: critical
    annotations:
      summary: "Container tried to load a host kernel module"
      description: "The kernel-module-load policy matched {{ printf \"%.0f\" $value }} event(s) in the last 5m. Lab guests that legitimately load modules do so inside a Kata microVM, so a request seen on the node is an escape or rootkit attempt."

  - alert: TetragonCryptoMinerExecution
    expr: sum by (policy) (increase(tetragon_policy_events_total{policy="crypto-miner-execution"}[5m])) > 0
    for: 0m
    labels:
      severity: critical
    annotations:
      summary: "Known cryptominer binary executed in a container"
      description: "The crypto-miner-execution policy matched {{ printf \"%.0f\" $value }} event(s) in the last 5m. A known miner binary was launched; the session is being used for resource abuse."

  # Correlation signals: legitimate under some lab scenarios, so alert on volume
  # or duration rather than a single event.
  - alert: TetragonDangerousCapabilityUse
    expr: sum by (policy) (increase(tetragon_policy_events_total{policy="dangerous-capabilities"}[5m])) > 0
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: "Container exercised a high-risk Linux capability"
      description: "The dangerous-capabilities policy has matched for 5m (CAP_SYS_MODULE/RAWIO/BOOT/TIME). Correlate with the host-escape, kernel-module and injection policies before actioning."

  - alert: TetragonProcessInjection
    expr: sum by (policy) (increase(tetragon_policy_events_total{policy="process-injection"}[5m])) > 5
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: "Sustained ptrace attach activity in a container"
      description: "The process-injection policy matched more than 5 ptrace-attach events in 5m. This is expected for a debugging lab; investigate if the namespace is not a debugging scenario."

  # Two token readers in lab namespaces are expected and excluded, because
  # client-go re-reads its token file about once a minute and so matches for
  # as long as a session runs:
  #   * the vcluster control plane (StatefulSet `vcluster-<hash>`), which talks
  #     to the host API server by design;
  #   * pods synced out of a virtual cluster (`<name>-x-<ns>-x-vcluster-<hash>`),
  #     which hold a token issued by that virtual cluster, with no rights on
  #     the host.
  - alert: TetragonServiceAccountTokenAccess
    expr: sum by (policy, namespace, workload) (increase(tetragon_policy_events_total{policy="serviceaccount-token-access", workload!~"vcluster-[0-9a-f]+|.+-x-.+-x-vcluster-[0-9a-f]+"}[5m])) > 0
    for: 10m
    labels:
      severity: warning
    annotations:
      summary: "Sustained ServiceAccount token reads in containers"
      description: "Workload {{ $labels.namespace }}/{{ $labels.workload }} has been reading its ServiceAccount token for 10m. Platform pods read their own token once at start-up (expected); a token read from a lab session namespace is not expected and should be investigated."
