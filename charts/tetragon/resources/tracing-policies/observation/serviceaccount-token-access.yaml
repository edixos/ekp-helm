# Reports a container reading a mounted Kubernetes ServiceAccount token.
#
# Same `security_file_permission` LSM kprobe as the bundled sensitive-file-access
# policy. The token is the bearer credential for the pod's identity against the
# kube-apiserver; a process reading it is either a legitimate in-cluster client
# starting up, or an attacker who has landed in a pod and is collecting the
# credential to talk to the API server or move laterally.
#
#   * both the current mount path (/run/secrets/...) and the legacy one
#     (/var/run/secrets/...) are watched, by prefix, so a token in any container
#     is covered.
#
# Scoped to containers only (Pid namespace not the host): the kubelet reads
# these paths on the node constantly.
#
# KNOWN FALSE POSITIVE: platform pods that use in-cluster config (for example
# klastro-api and the controller) read their own token once at start-up and will
# each produce one event. That is why this is report-only and rate-limited, and
# why it has no enforcement variant — the signal to watch for is a token read in
# a *lab* namespace (klastro-session-*/klastro-authoring-*), where user
# workloads have no reason to talk to the host API server.
#
# Report only: the single action is Post.
kprobes:
  - call: "security_file_permission"
    syscall: false
    return: true
    args:
      - index: 0
        type: "file"
      - index: 1
        type: "int" # 0x04 MAY_READ, 0x02 MAY_WRITE
    returnArg:
      index: 0
      type: "int"
    selectors:
      - matchNamespaces:
          - namespace: Pid
            operator: NotIn
            values:
              - "host_ns"
        matchArgs:
          - index: 0
            operator: "Prefix"
            values:
              - "/run/secrets/kubernetes.io/serviceaccount"
              - "/var/run/secrets/kubernetes.io/serviceaccount"
          - index: 1
            operator: "Equal"
            values:
              - "4" # MAY_READ
        matchActions:
          - action: Post
            rateLimit: "1m"
