# Reports credentials being installed on a task inside a container: a setuid
# binary raising privileges, a capability set being changed, a user namespace
# being entered.
#
# Derived from the upstream Tetragon example
# (examples/tracingpolicy/process-credentials/process-creds-installed.yaml,
# v1.7.1), unchanged in what it hooks:
#
#   * commit_creds() is the single point where the kernel installs a new
#     credential set on the current task, so it catches privilege changes
#     regardless of which syscall asked for them.
#   * the Pid namespace selector keeps host processes out. Every systemd-managed
#     service on the node calls commit_creds() on start; only what happens
#     inside a container is reported here.
#   * rateLimit collapses repeats within a minute, because commit_creds() also
#     fires on every execve even when the credentials did not change.
#
# Report only: the single action is Post, which emits the event.
kprobes:
  - call: "commit_creds"
    syscall: false
    args:
      - index: 0 # the new credentials to apply
        type: "cred"
    selectors:
      - matchNamespaces:
          - namespace: Pid
            operator: NotIn
            values:
              - "host_ns"
        matchActions:
          - action: Post
            rateLimit: "1m"
