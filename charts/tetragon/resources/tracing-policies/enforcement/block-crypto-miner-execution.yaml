# ENFORCING. SIGKILLs a process that execs a known cryptocurrency-miner binary.
#
# The enforcement twin of observation/crypto-miner-execution.yaml: same execve
# hook and same suffix list, with a Sigkill action instead of Post. Killing on
# exec stops the miner before it runs.
#
# Safe to enforce because the match is an exact set of miner binary names that no
# legitimate lab image ships. A determined attacker can still rename the binary
# to evade the list — that residual case is handled by the per-session
# ResourceQuota/LimitRange (mining is CPU-bound and the quota caps CPU) and by
# the report-only observation policy, which stays cluster-wide.
#
# Installed as a TracingPolicyNamespaced, never cluster-wide: into the namespaces
# listed under tracingPolicies.enforcement.namespaces, or, in sessionPolicies
# mode, into every Klastro session namespace by klastro-controller.
#
# Scoped to containers only (Pid namespace not the host), like its observation
# twin: host-namespace processes that the node attributes to a pod (a Kata shim
# or hypervisor) are never killed.
kprobes:
  - call: "sys_execve"
    syscall: true
    args:
      - index: 0
        type: "string" # program path
    selectors:
      - matchNamespaces:
          - namespace: Pid
            operator: NotIn
            values:
              - "host_ns"
        matchArgs:
          - index: 0
            operator: "Postfix"
            values:
              - "/xmrig"
              - "/minerd"
              - "/cpuminer"
              - "/cpuminer-multi"
              - "/ethminer"
              - "/cgminer"
              - "/bfgminer"
              - "/nbminer"
              - "/t-rex"
              - "/teamredminer"
              - "/xmr-stak"
              - "/xmr-stak-rx"
              - "/phoenixminer"
              - "/lolminer"
              - "/gminer"
              - "/nanominer"
              - "/srbminer"
              - "/srbminer-multi"
        matchActions:
          - action: Sigkill
