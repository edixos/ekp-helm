{{/*
NetworkPolicies for the Valkey release.

Valkey is typically run here without authentication (e.g. as the Envoy Gateway
rate-limit backend), so a policy is what keeps the rest of the cluster off it.
*/}}
{{- range $name, $policy := .Values.networkPolicies }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}
  namespace: {{ $policy.namespace | default $.Release.Namespace }}
  labels:
    {{- include "valkey-wrapper.labels" $ | nindent 4 }}
    {{- with $policy.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with $policy.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- toYaml $policy.spec | nindent 2 }}
{{- end }}
