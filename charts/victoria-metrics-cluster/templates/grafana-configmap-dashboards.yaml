{{- if and .Values.prometheus.enabled .Values.prometheus.grafanaDashboard.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "victoria-metrics-cluster.fullname" . }}-grafana-dashboards
  namespace: {{ .Release.Namespace | quote }}
  labels:
    app: victoria-metrics-grafana
    {{- include "victoria-metrics-cluster.labels" . | nindent 4 }}
{{- .Values.prometheus.grafanaDashboard.label | toYaml | nindent 4 }}
data:
  {{- (.Files.Glob "resources/grafana-dashboards/*.json").AsConfig | nindent 2 }}
{{- end }}
