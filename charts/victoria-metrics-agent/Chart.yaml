apiVersion: v2
name: victoria-metrics-agent
description: >-
  vmagent, packaged for the Edixos Kubernetes Platform. Wraps the upstream
  VictoriaMetrics agent chart — which scrapes targets and forwards samples to
  one or more remote write endpoints — and adds the platform extensions it does
  not provide: ExternalSecrets for the credentials vmagent consumes (remote
  write basic auth or bearer tokens, enterprise license), curated PrometheusRule
  alerts covering the persistent queue, scraping and remote write, and the
  official vmagent Grafana dashboard shipped as a sidecar-discoverable ConfigMap.
  Every extension is optional and driven entirely by values.
type: application

# This is the chart version. This version number should be incremented each time you make changes
# to the chart and its templates, including the app version.
# Versions are expected to follow Semantic Versioning (https://semver.org/)
version: 0.1.1

# This is the version number of the application being deployed. This version number should be
# incremented each time you make changes to the application. Versions are not expected to
# follow Semantic Versioning. They should reflect the version the application is using.
# It is recommended to use it with quotes.
appVersion: "v1.149.0"
maintainers:
  - name: mo-hamedaziz
    email: aziz@edixos.com
sources:
  - https://github.com/VictoriaMetrics/helm-charts/tree/master/charts/victoria-metrics-agent
  - https://docs.victoriametrics.com/helm/victoria-metrics-agent/
dependencies:
  - name: victoria-metrics-agent
    version: 0.45.0
    repository: "https://victoriametrics.github.io/helm-charts/"
    alias: vmagent
